<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<title>Pizza POS System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #111;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    z-index: 1000;
    background: #111;
    padding: 10px 0;
    border-bottom: 1px solid #111;
}

.brand {
    max-width: 100%;
    overflow: hidden;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    padding: 0 10px;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex: 0 0 auto;
    padding: 10px 20px;
    background: #2a2a2a;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
    width: 100px;
    text-align: center;
}

.category.active,
.category:hover {
    background: orange;
    color: black;
}

/* MAIN */
.main-wrapper {
    display: flex;
    margin-top: 70px;
    height: calc(100vh - 70px);
}

.sidebar {
    width: 80px;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
}

.sidebar div {
    margin: 20px 0;
    font-size: 22px;
    cursor: pointer;
    transition: 0.3s;
}

.sidebar div:hover {
    transform: scale(1.2);
}

.container {
    flex: 1;
    display: flex;
}

/* PRODUCTS */
.products-section {
    flex: 3;
    padding: 20px;
    overflow-y: auto;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
}

.card {
    background: gray;
    border-radius: 15px;
    padding: 10px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
}

.card h5 {
    margin: 5px 0;
}

.card p {
    font-weight: bold;
    color: orange;
}

.card i {
    font-size: 25px;
    cursor: pointer;
}

/* CART */
.cart {
    flex: 1;
    background: #1a1a1a;
    padding: 10px;
    display: flex;
    flex-direction: column;
}

.cart-items {
    flex: 1;
    overflow-y: auto;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    background: #2a2a2a;
    padding: 10px;
    border-radius: 8px;
}

.qty-control {
    display: flex;
    gap: 5px;
    align-items: center;
}

.qty-control button {
    background: orange;
    border: none;
    width: 25px;
    height: 25px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.summary {
    margin-top: 15px;
    border-top: 1px solid #444;
    padding-top: 10px;
}

.summary div {
    display: flex;
    justify-content: space-between;
    margin: 5px 0;
}

.checkout-btn {
    background: orange;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    font-weight: bold;
}

/* PAYMENT */
.payment {
    flex: 1;
    background: #1a1a1a;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.payment-total {
    text-align: center;
    margin: 30px 0;
}

.payment-total h1 {
    color: orange;
}

.payment-methods {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
}

.payment-methods button {
    padding: 12px 20px;
    background: #2a2a2a;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.payment-methods button.active {
    background: orange;
    color: black;
}

.back-btn,
.confirm-btn {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.back-btn { background: gray; }
.confirm-btn { background: orange; }

/* Responsive */
@media(max-width:768px){
    body{overflow:auto;}
    .sidebar{display:none;}
    .main-wrapper{flex-direction:column;height:auto;}
    .container{flex-direction:column;}
    .products-section{height:auto;}
}


/* Bottom Navigation Bar */
.navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 62px;
    background: #161b22;
    border-top: 1px solid #2a2f38;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 999;
}

/* Navigation Item */
.nav-item {
    text-align: center;
    color: var(--muted, #8b95a1);
    font-size: 0.75rem;
    flex: 1;
    padding-top: 6px;
    text-decoration: none; /* remove underline by default */
    transition: color 0.2s, font-weight 0.2s;
    cursor: pointer;
}

/* Icon or span inside nav item */
.nav-item span {
    display: block;
    font-size: 1.2rem;
    margin-bottom: 3px;
    transition: transform 0.2s;
}

.nav-item:hover span {
    transform: scale(1.1);
}

/* Active nav item */
.nav-item.active {
    color: var(--accent, #58a6ff);
    font-weight: bold;
    text-decoration: underline; 
}

.nav-item.active span {
    transform: scale(1.9); 
}
</style>
</head>

<body>
<nav class="navbar">
  <a href="/" class="nav-item">
    <span>🏠</span>
    Home
  </a>
  <a href="/logs" class="nav-item">
    <span>📄</span>
    Logs
  </a>
  <a href="/settings" class="nav-item">
    <span>⚙️</span>
    Settings
  </a>
  <a href="/graph" class="nav-item">
    <span>📊</span>
    Graph
  </a>
  <a href="report" class="nav-item">
    <span>📝</span>
    Report
  </a>
</nav>
<div class="header">
<div class="brand">
<div class="categories">
<div class="category active" onclick="filterCategory('All', event)">All</div>
<div class="category" onclick="filterCategory('Pizza', event)">Pizza</div>
<div class="category" onclick="filterCategory('Drinks', event)">Drinks</div>
<div class="category" onclick="filterCategory('Dessert', event)">Dessert</div>
<div class="category" onclick="filterCategory('Coffee', event)">Coffee</div>
<div class="category" onclick="filterCategory('Fried', event)">Fried</div>
<div class="category" onclick="filterCategory('Silog', event)">Silog</div>
<div class="category" onclick="filterCategory('Shake', event)">Shake</div>
</div>
</div>
</div>


<div class="main-wrapper">

<!--<div class="sidebar">
<div>🍕</div>
<div>🍔</div>
<div>🥤</div>
</div>-->

<div class="container">

<div class="products-section">
<div class="products" id="productList"></div>
</div>

<div class="cart">
<h2>Cart</h2>
<div class="cart-items" id="cartItems"></div>

<div class="summary">
<div><span>Subtotal</span><span id="subtotal">₱0.00</span></div>
<div><span>Tax (5%)</span><span id="tax">₱0.00</span></div>
<div><strong>Total</strong><strong id="total">₱0.00</strong></div>
</div>

<button class="checkout-btn" onclick="checkout()">Proceed</button>
</div>

</div>

<div class="payment" id="paymentSection" style="display:none;">
<h2>Payment</h2>

<div class="payment-total">
<h3>Total Amount</h3>
<h1 id="paymentTotal">₱0.00</h1>
</div>

<div class="payment-methods">
<button onclick="selectPayment('Cash', event)">💵 Cash</button>
<button onclick="selectPayment('Card', event)">💳 Card</button>
</div>

<div id="cashForm" style="display:none; margin-top:20px;">
<label>Cash Received:</label>
<input type="number" id="cashInput" 
style="width:100%;padding:8px;margin-top:5px;border-radius:6px;border:none;">
<div style="margin-top:10px;">
<strong>Change:</strong> <span id="changeAmount">₱0.00</span>
</div>
</div>

<div id="cardQR" style="display:none; text-align:center; margin-top:20px;">
<p>Scan QR to Pay</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PizzaPOSPayment" width="200">
<br><br>
<button onclick="simulateCardPayment()" 
style="padding:10px 20px;background:orange;border:none;border-radius:8px;cursor:pointer;">
I've Paid
</button>
</div>

<div class="payment-actions">
<button class="back-btn" onclick="goBack()">⬅ Back</button>
<button class="confirm-btn" onclick="confirmCashPayment()">Confirm</button>
</div>
</div>

</div>

<script>
/* ================= PRODUCTS ================= */
const TAX_RATE = 0.05; // 5% tax

const products = [

  // PIZZAS
  { id: 1, name: "Classic Margherita", price: 12.99, category: "Pizza",
    image:"img/classic-margherita.jpeg" },

  { id: 2, name: "Hawaiian Pizza", price: 13.99, category: "Pizza",
    image:"/Hawaiian-Pizza.jpeg" },

  // DRINKS
  { id: 3, name: "Coca Cola", price: 2.99, category: "Drinks",
    image:"img/coca cola.jpeg" },

  // DESSERTS
  { id: 4, name: "Halo-Halo", price: 13.99, category: "Dessert",
    image:"img/halo-halo.jpeg" },

  { id: 5, name: "Leche Flan", price: 13.99, category: "Dessert",
    image:"img/leche-flan.jpeg" },

  // SILOG
  { id: 6, name: "Pork Silog", price: 12.99, category: "Silog",
    image:"img/pork-silog.jpeg" },

  // COFFEE
  { id: 7, name: "Coffee Latte", price: 12.99, category: "Coffee",
    image:"img/coffee-latte.jpeg" },

  { id: 8, name: "Kopiko", price: 2.99, category: "Coffee",
    image:"img/kopiko.jpeg" },

  // FRIED
  { id: 9, name: "Fried Chicken", price: 8.99, category: "Fried",
    image:"img/fried-chicken.jpeg" },

  // SHAKES
  { id: 10, name: "Cookies & Cream", price: 2.99, category: "Shake",
    image:"img/ChocoKisses.jpeg" },

  { id: 11, name: "Choco Kisses", price: 2.99, category: "Shake",
    image:"img/choco-kisses.jpeg" },

  { id: 12, name: "Chocolate", price: 2.99, category: "Shake",
    image:"img/chocolate.jpeg" },

  { id: 13, name: "Hot Fudge", price: 2.99, category: "Shake",
    image:"img/hot-fudge.jpeg" },

  { id: 14, name: "Ube Macapuno", price: 2.99, category: "Shake",
    image:"img/ube-macapuno.jpeg" },

  { id: 15, name: "Mango", price: 2.99, category: "Shake",
    image:"img/mango.jpeg" },

  { id: 16, name: "Avocado", price: 2.99, category: "Shake",
    image:"img/avocado.jpeg" },

  { id: 17, name: "Buko Pandan", price: 2.99, category: "Shake",
    image:"img/buko-pandan.jpeg" },

  { id: 18, name: "Taro", price: 2.99, category: "Shake",
    image:"img/taro.jpeg" },

  { id: 19, name: "Strawberry", price: 2.99, category: "Shake",
    image:"img/strawberry.jpeg" },

  { id: 20, name: "Vanilla", price: 2.99, category: "Shake",
    image:"img/vanilla.jpeg" },

  { id: 21, name: "Melon", price: 2.99, category: "Shake",
    image:"img/melon.jpeg" },

  { id: 22, name: "Caramel Macchiato", price: 2.99, category: "Shake",
    image:"img/caramel-macchiato.jpeg" },

  { id: 23, name: "Black Forest", price: 2.99, category: "Shake",
    image:"img/Black-Forest.jpeg" },

  { id: 24, name: "Double Dutch", price: 2.99, category: "Shake",
    image:"img/double-dutch.jpeg" }

];

let cart = [];
let selectedPaymentMethod = "";
let finalTotal = 0;
let currentCategory = "All";

/* ================= RENDER PRODUCTS ================= */
function renderProducts(list) {
    const container = document.getElementById("productList");

    container.innerHTML = list.map(product => {

        const cartItem = cart.find(item => item.id === product.id);
        const qty = cartItem ? cartItem.qty : 0;

        return `
        <div class="card">
            <img src="${product.image}" 
                 
            
            <h5>${product.name}</h5>

            <div style="display:flex;justify-content:space-between;align-items:center;">
                <p>₱${product.price.toFixed(2)}</p>

                ${
                    qty === 0
                    ? `<i class="fas fa-shopping-cart"
                          style="cursor:pointer;font-size:22px;"
                          onclick="addToCart(${product.id})"></i>`
                    : `
                    <div style="display:flex;align-items:center;gap:5px;">
                        <button onclick="changeQty(${product.id}, -1)"
                            style="width:22px;height:22px;border:none;border-radius:5px;background:orange;font-weight:bold;">-</button>
                        
                        <span style="min-width:20px;text-align:center;">${qty}</span>
                        
                        <button onclick="changeQty(${product.id}, 1)"
                            style="width:22px;height:22px;border:none;border-radius:5px;background:orange;font-weight:bold;">+</button>
                    </div>
                    `
                }
            </div>
        </div>
        `;
    }).join("");
}
/* ================= CATEGORY FILTER ================= */
function filterCategory(category, e) {
currentCategory = category;
document.querySelectorAll('.category').forEach(c=>c.classList.remove('active'));
e.target.classList.add('active');

renderProducts(
    category==="All"
    ? products
    : products.filter(p=>p.category===category)
);
}

/* ================= CART FUNCTIONS ================= */
function addToCart(id){
const product=products.find(p=>p.id===id);
const item=cart.find(p=>p.id===id);
item?item.qty++:cart.push({...product,qty:1});
renderCart();
}

function changeQty(id,c){
const item=cart.find(i=>i.id===id);
if(!item)return;
item.qty+=c;
if(item.qty<=0) removeItem(id);
else renderCart();
}

function removeItem(id){
cart=cart.filter(i=>i.id!==id);
renderCart();
}

function renderCart(){
const container=document.getElementById("cartItems");
container.innerHTML=cart.map(item=>`
<div class="cart-item">
<div>${item.name}<br>₱${item.price.toFixed(2)}</div>
<div class="qty-control">
<button onclick="changeQty(${item.id},-1)">-</button>
${item.qty}
<button onclick="changeQty(${item.id},1)">+</button>
<button onclick="removeItem(${item.id})">X</button>
</div>
</div>`).join("");

updateSummary();

renderProducts(
currentCategory==="All"
? products
: products.filter(p=>p.category===currentCategory)
);
}

/* ================= SUMMARY ================= */
function updateSummary(){
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
const tax=subtotal*TAX_RATE;
finalTotal=subtotal+tax;

document.getElementById("subtotal").innerText=`₱${subtotal.toFixed(2)}`;
document.getElementById("tax").innerText=`₱${tax.toFixed(2)}`;
document.getElementById("total").innerText=`₱${finalTotal.toFixed(2)}`;
}

/* ================= CHECKOUT ================= */
function checkout(){
if(cart.length===0)return alert("Cart is empty!");
document.querySelector(".cart").style.display="none";
document.getElementById("paymentSection").style.display="flex";
document.getElementById("paymentTotal").innerText=`₱${finalTotal.toFixed(2)}`;
}

/* ================= PAYMENT ================= */
function selectPayment(method,e){
selectedPaymentMethod=method;
document.querySelectorAll(".payment-methods button")
.forEach(b=>b.classList.remove("active"));
e.target.classList.add("active");

document.getElementById("cashForm").style.display=
method==="Cash"?"block":"none";

document.getElementById("cardQR").style.display=
method==="Card"?"block":"none";
}

/* Live change calculation */
document.getElementById("cashInput")
.addEventListener("input",function(){
const cash=parseFloat(this.value)||0;
const change=cash-finalTotal;
document.getElementById("changeAmount").innerText=
change>=0?`₱${change.toFixed(2)}`:"₱0.00";
});

function confirmCashPayment(){
if(selectedPaymentMethod!=="Cash")
return alert("Select Cash payment");

const cash=parseFloat(document.getElementById("cashInput").value);
if(!cash||cash<finalTotal)
return alert("Insufficient cash");

completeOrder("Cash");
}

function simulateCardPayment(){
if(selectedPaymentMethod!=="Card")
return alert("Select Card payment");

completeOrder("Card");
}

/* ================= COMPLETE ORDER ================= */
function completeOrder(method){
const orderItems=[...cart];

alert("Payment Successful via "+method);
printReceipt(method,orderItems);

cart=[];
renderCart();
goBack();
}

function goBack(){
document.getElementById("paymentSection").style.display="none";
document.querySelector(".cart").style.display="flex";
document.getElementById("cashInput").value="";
document.getElementById("changeAmount").innerText="₱0.00";
selectedPaymentMethod="";
}

/* ================= RECEIPT ================= */
function printReceipt(method,items){
let receipt=window.open("","","width=300,height=600");

let itemList=items.map(i=>
`${i.name} x${i.qty} - ₱${(i.price*i.qty).toFixed(2)}`
).join("<br>");

receipt.document.write(`
<html>
<body style="font-family:monospace;padding:10px;">
<h2>Cart Avenue</h2>
<hr>
${itemList}
<hr>
<h3>Total: ₱${finalTotal.toFixed(2)}</h3>
<h3>Payment: ${method}</h3>
<h4>${new Date().toLocaleString()}</h4>
<hr>
<center>Thank you!</center>
</body>
</html>`);

receipt.document.close();
receipt.print();
}

renderProducts(products);
</script>


</body>
</html>
